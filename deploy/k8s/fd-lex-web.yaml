# fd-lex-web — prod (fd-prod)
# 识律门面静态面（官网 / /console / /admin SPA；nginx on :80）。
# 对外：NodePort ← cheap-1 SafeLine→Caddy→tailscale（lex.finddatatech.cloud，
# wire/wanxing 同法）；/mcp 由 Caddy 直接反代 registry lex 入口，不经本 Service。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-lex-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-web
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1  # fd-prod 轻档（wire 同约束；requests.memory 余量小）
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-lex-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-lex-web
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: web
          image: ccr.ccs.tencentyun.com/finddata-business/fd-lex-web:sha-1bb6367 # 识律产品条线（change define-lex-product-lineup，已归档 2026-11-13）：能力目录拆两段（能力 5 行 + 交付 2 行）、补 matter（案件）行、删掉 models 行「量化产物与对照评测报告随交付包」的违规承诺（与 lex-collateral 红线冲突）、index.html 加 rel=canonical 指向产品面 law.*。源真 fd-lex 6c1d8ffe；快照仓 scs001/fd-lex-priv-images 1bb6367（run 43442803933：api 1m3s / web 2m7s 绿，web digest 894010ea）；上一版 sha-26b3e49；回滚=改回 sha-26b3e49。2026-11-13 上产前：tsc 净、vitest 105 绿、build 绿、check_product_lineup --strict 八条全绿、五宿主 locale parity 绿；出片走快照仓 URL 通道（fd-lex 自身 GHA 因组织额度耗尽停摆）
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fd-lex-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-web
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-lex-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31885
