# fd-lex-web — prod (fd-prod)
# 识律门面静态面（官网 / /console / /admin SPA；nginx on :80）。
# 对外：NodePort ← cheap-1 SafeLine→Caddy→tailscale（lex.finddatatech.cloud，
# wire/wanxing 同法）；/mcp 由 Caddy 直接反代 registry lex 入口，不经本 Service。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-lex-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-web
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1  # fd-prod 轻档（wire 同约束；requests.memory 余量小）
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-lex-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-lex-web
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: web
          image: ccr.ccs.tencentyun.com/finddata-business/fd-lex-web:sha-76330c0 # 共享前端壳：i18next 移除 + auth 换壳 + kit 落地（change lex-web-shell-convergence）；源 e05a304；快照仓 scs001/fd-lex-priv-images c7501b8；上一版 sha-4ae80ec。2026-11-10 上产：75 测试 + tsc + build 绿，预览三入口无裸键；回滚=改回上一 tag。原注：控制台副驾改用万星 loader（124 行宿主协议 + 硬编码 WIDGET_SLUG 下线，副驾由「线副驾」绑定解析）；源 fd-lex 1602ed4；快照仓 scs001/fd-lex-priv-images 4ae80ec（run 42653938440 镜像已推 digest 65832516，但 GHA 缓存导出失败使内容闸门未跑——sha-4ae80ec 由 imagetools 等价操作手工铸自该 digest）；上一版 sha-c4b0953 见 git 历史
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fd-lex-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-web
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-lex-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31885
