# fd-lex-api — prod (fd-prod)
# 识律平台 API（计量/结算/对账/内部管理面，FastAPI on :8000）。
# 只暴露 ClusterIP；控制台将来经 web/nginx /api/ 反代启用（wire 同法）。
# env ← Secret fd-lex-env（键名表 deploy/README.md；清单无明文）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-lex-api
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-api
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1
  # fd-prod compute-quota（limits.cpu 10 核）已顶格：surge 起新 Pod 会因配额
  # 被拒（2026-10-06 首客开户演练实测）——先撤旧再起新，并把 limit 收紧到 250m。
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-lex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-lex-api
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      # 迁移先行：schema 唯一事实源=alembic 链（2026-10-12 sqlite→PG 接客
      # 硬前提）。initContainer 幂等 upgrade head 后主容器才起——发版不再
      # 依赖 create_all（生产 METERING_AUTO_CREATE_TABLES=false）。
      initContainers:
        - name: migrate
          image: ccr.ccs.tencentyun.com/finddata-business/fd-lex-api:sha-0a2eff5
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: fd-lex-env
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
      containers:
        - name: api
          image: ccr.ccs.tencentyun.com/finddata-business/fd-lex-api:sha-0a2eff5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
          envFrom:
            - secretRef:
                name: fd-lex-env
          env:
            # 电子签编排面本地文件仓：合同全文只落客户侧（sha256 即文件名），
            # 跨出到签署服务商的只有哈希。卷丢失=待签任务不可预览、出证包不可下载，
            # 生产必须持久卷+备份。ESIGN_PROVIDER 刻意不预置：未配置即 fail-closed
            # （发起如实报「签署腿未配置」），厂商连接器凭证待选型 spike 后经 Secret 注入。
            - name: ESIGN_FILE_STORE_DIR
              value: /data/esign
          volumeMounts:
            - name: esign-files
              mountPath: /data/esign
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: esign-files
          persistentVolumeClaim:
            claimName: lex-esign-files
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lex-esign-files
  namespace: fd-prod
  labels:
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fd-lex-api
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-api
    app.kubernetes.io/part-of: finddata
spec:
  # NodePort（31886）：cheap-1 宿主 Caddy /api/* 反代需要从宿主可达（wire 31883 同法；
  # README 曾写 ClusterIP，与 wire 实际形态不符，已对齐现实）。
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-lex-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31886
