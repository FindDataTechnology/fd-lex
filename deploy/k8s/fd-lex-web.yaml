# fd-lex-web — prod (fd-prod)
# 识律门面静态面（官网 / /console / /admin SPA；nginx on :80）。
# 对外：NodePort ← cheap-1 SafeLine→Caddy→tailscale（lex.finddatatech.cloud，
# wire/wanxing 同法）；/mcp 由 Caddy 直接反代 registry lex 入口，不经本 Service。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-lex-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-web
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1  # fd-prod 轻档（wire 同约束；requests.memory 余量小）
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-lex-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-lex-web
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: web
          image: ccr.ccs.tencentyun.com/finddata-business/fd-lex-web:sha-e833b20 # 2026-11-18 sha-e833b20（源真 1404985）：在 sha-b0310e6 基础上修 consent_required 被当故障（真机跨站静默时 Logto 按客户端分别授权）；回滚=sha-b0310e6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fd-lex-web
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-lex-web
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-lex-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31885
