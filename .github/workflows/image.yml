# 共享实现见 FindDataTechnology/fd-ci（openspec: extract-shared-ci-workflow）。
# 本仓出两个镜像，各自一个 job —— 与原来的两个 build 步骤一一对应。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-lex-web
      namespace: finddata-business
      context: web
      dockerfile: web/Dockerfile

  api:
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-lex-api
      namespace: finddata-business
      context: server
      dockerfile: server/Dockerfile
